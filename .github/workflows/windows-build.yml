name: Windows build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build application
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Verify JAR
        shell: pwsh
        run: |
          $jar = Get-ChildItem target -Filter "*-jar-with-dependencies.jar" -File
          if (-not $jar) {
            Write-Error "Aucun JAR autonome généré."
            Get-ChildItem target -File
            exit 1
          }
          Write-Host "JAR trouvé : $($jar.FullName)"

      - name: Upload runnable JAR
        uses: actions/upload-artifact@v4
        with:
          name: CryptImage-Windows-JAR
          path: target/*-jar-with-dependencies.jar
          if-no-files-found: error
